name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write       # GoReleaser 需要权限创建 GitHub Releases

jobs:
  release:
    name: GoReleaser (GitHub Releases only — npm publish is manual)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # GoReleaser 需要完整 git history 生成 changelog

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Run tests
        run: go test -race ./...

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # npm publish 故意不在 CI 里:
      # - npm 账号 2FA(auth-and-writes)模式下 publish 强制 OTP
      # - 自动化 token 也会被 EOTP 拒
      # 所以发布人本机跑:
      #   npm version <tag> --no-git-tag-version --allow-same-version
      #   npm publish --access public
      # 或更简单:make publish
